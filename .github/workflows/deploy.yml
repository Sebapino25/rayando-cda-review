name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'mediakit/*.html'
      - 'mediakit/*.js'
      - 'mediakit/*.css'
      - 'mediakit/assets/**'
      - 'mediakit/shared/**'
      - 'mediakit/dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - working-directory: app
        run: npm ci

      - working-directory: app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copiar el media kit vivo al mismo sitio, en /mediakit/
        run: |
          mkdir -p app/dist/mediakit
          cp mediakit/*.html mediakit/*.js mediakit/*.css app/dist/mediakit/
          cp -r mediakit/assets mediakit/shared mediakit/dashboard app/dist/mediakit/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
