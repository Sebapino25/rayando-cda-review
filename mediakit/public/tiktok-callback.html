<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TikTok — autorización</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #1a1a1a;
    }
    code {
      display: block;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      word-break: break-all;
      font-size: 0.95rem;
      margin: 1rem 0;
    }
    button {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      border: none;
      background: #111;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .error { color: #b00020; }
    .hint { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Autorización de TikTok</h1>
  <div id="resultado">Leyendo la respuesta...</div>

  <script>
    // Página de callback para el flujo de autorización OAuth de TikTok
    // (Login Kit / Content Posting API). Es un paso manual único que hace
    // Sebastián desde su propia cuenta de TikTok — esta página NO intercambia
    // el code por un token acá (eso requiere el Client Secret, que nunca debe
    // viajar a una página estática pública). Solo muestra el code para
    // copiarlo y pegarlo en el script local que hace el intercambio.
    const params = new URLSearchParams(window.location.search)
    const code = params.get('code')
    const error = params.get('error')
    const errorDescription = params.get('error_description')
    const contenedor = document.getElementById('resultado')

    if (error) {
      contenedor.innerHTML = `
        <p class="error"><strong>TikTok devolvió un error:</strong> ${error}</p>
        <p>${errorDescription || ''}</p>
      `
    } else if (code) {
      contenedor.innerHTML = `
        <p>Copiá este código y pegalo en el script de intercambio
        (<code style="display:inline;padding:0.1rem 0.4rem;">pipeline/tiktok_oauth_intercambiar_codigo.py --code &lt;code&gt;</code>):</p>
        <code id="code">${code}</code>
        <button id="copiar">Copiar</button>
        <p class="hint">El código expira en unos minutos — corré el script enseguida.</p>
      `
      document.getElementById('copiar').addEventListener('click', () => {
        navigator.clipboard.writeText(code)
        document.getElementById('copiar').textContent = 'Copiado ✓'
      })
    } else {
      contenedor.innerHTML = '<p class="error">No llegó ningún parámetro "code" ni "error" en la URL.</p>'
    }
  </script>
</body>
</html>
